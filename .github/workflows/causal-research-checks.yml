name: Causal communication research checks

on:
  push:
    branches:
      - feat/causal-communication-e0-e3
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify Python module compilation
        run: |
          python -m compileall -q src/flyswarm/research/causal_comm.py src/flyswarm/brain/__init__.py src/flyswarm/bridge/server.py tools/causal_neural_replay.py tools/research.py
      - name: Run causal communication and complete Python test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_causal_communication.py
          python -m pytest -q tests
