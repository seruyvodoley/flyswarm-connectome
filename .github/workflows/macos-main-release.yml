name: macOS FlySwarm full edition beta (Open Day and research)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-main-release.yml'
      - 'src/**'
      - 'frontend/**'
      - 'tools/**'
      - 'requirements*.txt'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-main-beta2
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: 1.0.0-beta.2
      TAG: v1.0.0-beta.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify Apple Silicon and install dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt pyinstaller
      - name: Install official Godot 4.7.2 and macOS export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $RUNNER_TEMP/godot.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          cp -R "$RUNNER_TEMP/templates/templates/." "$template_dir/"
      - name: Run complete Python tests and UI/Open Day validation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          .venv/bin/python -m pytest -q tests
          "$GODOT" --headless --editor --path frontend/godot --import
          "$GODOT" --headless --path frontend/godot --script res://scripts/app/bridge_protocol_validation.gd
          "$GODOT" --headless --path frontend/godot --script res://scripts/app/open_day_validation.gd
      - name: Acquire and checksum-verify the MaleCNS model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/malecns"
          .venv/bin/python -c 'import sys; from flybrain.data import download; download(sys.argv[1])' "$RUNNER_TEMP/malecns"
      - name: Verify the real Open Day neural backend
        shell: bash
        env:
          FLY_DATA: ${{ runner.temp }}/malecns
        run: |
          set -euo pipefail
          "$GODOT" --headless --path frontend/godot --script res://scripts/app/open_day_real_validation.gd
      - name: Build complete FlySwarm full app for macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/package_macos.py --build --version "$VERSION" --godot "$GODOT" --python "$PWD/.venv/bin/python" --dataset "$RUNNER_TEMP/malecns"
          out="build/releases/$VERSION"
          test -s "$out/FlySwarm-$VERSION-macos-arm64.dmg"
          test -s "$out/FlySwarm-$VERSION-macos-arm64.zip"
          (cd "$out" && shasum -a 256 --check SHA256SUMS.txt)
          codesign --verify --deep --strict "$out/FlySwarm.app"
          bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$out/FlySwarm.app/Contents/Info.plist")
          test "$(lipo -archs "$out/FlySwarm.app/Contents/MacOS/$bin")" = arm64
      - name: Smoke installed app and backend outside source tree
        shell: bash
        run: |
          set -euo pipefail
          out="build/releases/$VERSION"
          dest="$RUNNER_TEMP/FlySwarm.app"
          ditto "$out/FlySwarm.app" "$dest"
          bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$dest/Contents/Info.plist")
          "$dest/Contents/MacOS/$bin" --headless --quit-after 3
          backend="$dest/Contents/Resources/backend/FlySwarmBackend/FlySwarmBackend"
          test -x "$backend"
          "$backend" --check-data --data-dir "$dest/Contents/Resources/MaleCNS"
          "$backend" --marl --output-root "$RUNNER_TEMP/main-smoke" baseline --episodes 1 --max-steps 16
          mkdir -p "$RUNNER_TEMP/mounted"
          hdiutil attach "$out/FlySwarm-$VERSION-macos-arm64.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mounted"
          test -d "$RUNNER_TEMP/mounted/FlySwarm.app"
          hdiutil detach "$RUNNER_TEMP/mounted"
      - name: Upload signed candidate and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: FlySwarm-Full-macOS-arm64-Beta2
          path: |
            build/releases/${{ env.VERSION }}/FlySwarm-*.dmg
            build/releases/${{ env.VERSION }}/FlySwarm-*.zip
            build/releases/${{ env.VERSION }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish technical beta only after passing gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            "build/releases/$VERSION/FlySwarm-$VERSION-macos-arm64.dmg" \
            "build/releases/$VERSION/FlySwarm-$VERSION-macos-arm64.zip" \
            "build/releases/$VERSION/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease \
            --title "FlySwarm 1.0.0 Beta 2 — macOS arm64" \
            --notes "Full edition with Open Day, MARL Laboratory improvements and an opt-in research-only causal communication diagnostic. E0/E1 local neural replay is exploratory; complete Godot+MaleCNS checkpoint/restore, E3/E4 behavior studies, and scientific readiness are NOT validated. Ad-hoc signed; not notarized."
