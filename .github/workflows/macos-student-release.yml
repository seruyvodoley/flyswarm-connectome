name: macOS Student release (Apple Silicon)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-student-beta2
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Student Edition arm64
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: 1.0.0-student-beta.2
      TAG: v1.0.0-student-beta.2-macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          df -h .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt pyinstaller
      - name: Install exact Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  $RUNNER_TEMP/godot.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          cp -R "$RUNNER_TEMP/templates/templates/." "$template_dir/"
      - name: Verify sources, run Python and Godot tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          .venv/bin/python -m pytest -q tests
          "$GODOT" --headless --editor --path frontend/godot --import
          "$GODOT" --headless --path frontend/godot --script res://scripts/app/student_edition_validation.gd
          "$GODOT" --headless --path frontend/godot --script res://scripts/app/bridge_protocol_validation.gd
      - name: Acquire and verify MaleCNS model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/malecns"
          .venv/bin/python -c 'import sys; from flybrain.data import download; download(sys.argv[1])' "$RUNNER_TEMP/malecns"
      - name: Build signed macOS Student DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/package_macos.py --build --version "$VERSION" --godot "$GODOT" --python "$PWD/.venv/bin/python" --dataset "$RUNNER_TEMP/malecns"
          out="build/releases/$VERSION"
          test -s "$out/FlySwarm-Student-$VERSION-macos-arm64.dmg"
          test -s "$out/FlySwarm-Student-$VERSION-macos-arm64.zip"
          (cd "$out" && shasum -a 256 --check SHA256SUMS.txt)
          codesign --verify --deep --strict "$out/FlySwarm Student.app"
          bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$out/FlySwarm Student.app/Contents/Info.plist")
          test "$(lipo -archs "$out/FlySwarm Student.app/Contents/MacOS/$bin")" = arm64
          df -h .
      - name: Smoke-test installed application
        shell: bash
        run: |
          set -euo pipefail
          out="build/releases/$VERSION"
          dest="$RUNNER_TEMP/FlySwarm Student.app"
          ditto "$out/FlySwarm Student.app" "$dest"
          bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$dest/Contents/Info.plist")
          "$dest/Contents/MacOS/$bin" --headless --quit-after 3
          backend="$dest/Contents/Resources/backend/FlySwarmBackend/FlySwarmBackend"
          test -x "$backend"
          "$backend" --check-data --data-dir "$dest/Contents/Resources/MaleCNS"
          "$backend" --marl --output-root "$RUNNER_TEMP/student-smoke" baseline --episodes 1 --max-steps 16
          "$backend" --marl --output-root "$RUNNER_TEMP/student-smoke" --experiment-dir "$RUNNER_TEMP/student-smoke/train" train --steps 64 --seed 7 --max-steps 16
          checkpoint="$RUNNER_TEMP/student-smoke/train/checkpoint/ppo_team.zip"
          "$backend" --marl --output-root "$RUNNER_TEMP/student-smoke" evaluate "$checkpoint" --episodes 1 --seed 21 --max-steps 16
          "$backend" --marl --output-root "$RUNNER_TEMP/student-smoke" compare "$checkpoint" --episodes 1 --seed 31 --max-steps 16
          mkdir -p "$RUNNER_TEMP/mounted"
          hdiutil attach "$out/FlySwarm-Student-$VERSION-macos-arm64.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mounted"
          test -d "$RUNNER_TEMP/mounted/FlySwarm Student.app"
          hdiutil detach "$RUNNER_TEMP/mounted"
      - name: Save distributable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlySwarm-Student-macOS-arm64
          path: |
            build/releases/${{ env.VERSION }}/FlySwarm-Student-*.dmg
            build/releases/${{ env.VERSION }}/FlySwarm-Student-*.zip
            build/releases/${{ env.VERSION }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease only after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG"             "build/releases/$VERSION/FlySwarm-Student-$VERSION-macos-arm64.dmg"             "build/releases/$VERSION/FlySwarm-Student-$VERSION-macos-arm64.zip"             "build/releases/$VERSION/SHA256SUMS.txt"             --target "$GITHUB_SHA" --prerelease             --title "FlySwarm Student 1.0.0 Beta 2 — macOS Apple Silicon"             --notes "Student Edition based on the student branch. Includes scrollable MARL Experiment Status, Windows progress-file lock recovery, and longer Python student-worker startup timeouts. Open Day remains disabled. Ad-hoc signed, not notarized."
