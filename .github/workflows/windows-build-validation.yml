name: Windows x64 build validation

on:
  push:
    branches:
      - student
    paths:
      - '.github/workflows/windows-build-validation.yml'
      - 'src/**'
      - 'frontend/**'
      - 'tools/**'
      - 'requirements*.txt'
      - 'data/**'
      - 'docs/MALECNS_DATA_NOTICE.txt'
  workflow_dispatch:
    inputs:
      version:
        description: Version used for the Student Edition candidate
        required: true
        type: string
        default: 1.0.0-student-beta.1-windows

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies and Inno Setup
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          choco install innosetup --yes --no-progress
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download and verify MaleCNS data
        shell: pwsh
        run: |
          $dataset = Join-Path $PWD 'build\male-cns'
          New-Item -ItemType Directory -Force $dataset | Out-Null
          python -c "import sys; from flybrain.data import download; download(sys.argv[1])" $dataset
          "MALECNS_DATASET=$dataset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Godot 4.7.2 and export templates
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          $base = "https://github.com/godotengine/godot/releases/download/$version"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip godot
          $godot = (Get-ChildItem godot -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw 'Godot executable was not found in the official archive.' }
          "GODOT_EXE=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile templates.tpz
          New-Item -ItemType Directory -Force templates | Out-Null
          New-Item -ItemType Directory -Force "$env:APPDATA\Godot\export_templates\4.7.2.stable" | Out-Null
          tar -xf templates.tpz -C templates
          Copy-Item 'templates\templates\*' "$env:APPDATA\Godot\export_templates\4.7.2.stable" -Recurse -Force

      - name: Run MARL and simulator tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python test suite failed.' }
          & $env:GODOT_EXE --headless --editor --path frontend/godot --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot asset import failed.' }
          & $env:GODOT_EXE --headless --path frontend/godot --script res://scripts/app/student_edition_validation.gd
          if ($LASTEXITCODE -ne 0) { throw 'Student Edition UI validation failed.' }
          & $env:GODOT_EXE --headless --path frontend/godot --script res://scripts/app/bridge_protocol_validation.gd
          if ($LASTEXITCODE -ne 0) { throw 'Bridge protocol validation failed.' }

      - name: Build and smoke-test Windows app and backend
        shell: pwsh
        run: |
          $version = '${{ inputs.version || format('1.0.0-student-ci.{0}-windows', github.run_number) }}'
          python tools/package_windows.py --version $version --godot "$env:GODOT_EXE" --dataset "$env:MALECNS_DATASET"
          $installer = Get-ChildItem build/windows -Filter '*windows-x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'FlySwarmInstalled'
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait
          $app = Join-Path $installDir 'FlySwarm.exe'
          if (-not (Test-Path $app)) { throw 'Installed app executable is missing.' }
          & $app --headless --quit-after 3
          $backend = Join-Path $installDir 'Resources\backend\FlySwarmBackend\FlySwarmBackend.exe'
          $smoke = Join-Path $env:RUNNER_TEMP 'installed-smoke'
          & $backend --marl --output-root $smoke baseline --episodes 1 --max-steps 16
          if ($LASTEXITCODE -ne 0) { throw 'Installed Random baseline smoke failed.' }
          $checkpointDir = Join-Path $smoke 'training'
          & $backend --marl --output-root $smoke --experiment-dir $checkpointDir train --steps 64 --seed 7 --max-steps 16
          if ($LASTEXITCODE -ne 0) { throw 'Installed PPO training smoke failed.' }
          $checkpoint = Join-Path $checkpointDir 'checkpoint\ppo_team.zip'
          & $backend --marl --output-root $smoke evaluate $checkpoint --episodes 1 --seed 21 --max-steps 16
          if ($LASTEXITCODE -ne 0) { throw 'Installed PPO evaluation smoke failed.' }
          & $backend --marl --output-root $smoke compare $checkpoint --episodes 1 --seed 31 --max-steps 16
          if ($LASTEXITCODE -ne 0) { throw 'Installed paired comparison smoke failed.' }

          $studentAgent = Join-Path $env:RUNNER_TEMP 'student-agent.py'
          @'
          import numpy as np
          def act_team(observations, contexts):
              return np.zeros((len(observations), 6), dtype=np.float32)
          '@ | Set-Content -Path $studentAgent -Encoding utf8
          $studentDir = Join-Path $smoke 'student-progress'
          & $backend --marl --output-root $smoke --experiment-dir $studentDir student --agent-file $studentAgent --episodes 1 --seed 41 --max-steps 2
          if ($LASTEXITCODE -ne 0) { throw 'Installed student strategy smoke failed.' }
          $studentProgress = Get-Content (Join-Path $studentDir 'progress.json') -Raw | ConvertFrom-Json
          if ($studentProgress.state -ne 'complete' -or $studentProgress.completed -ne $studentProgress.total -or $studentProgress.world_steps -le 0) {
            throw "Installed student strategy progress is incorrect: $($studentProgress | ConvertTo-Json -Compress)"
          }

          $portable = Get-ChildItem build/windows -Filter '*windows-x64.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Windows portable archive was not produced.' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'FlySwarmPortable'
          Expand-Archive -Path $portable.FullName -DestinationPath $portableDir -Force
          $portableApp = Join-Path $portableDir 'FlySwarm/FlySwarm.exe'
          if (-not (Test-Path $portableApp)) { throw 'Portable app executable is missing.' }
          & $portableApp --headless --quit-after 3
          if ($LASTEXITCODE -ne 0) { throw 'Portable app launch smoke failed.' }
          $portableBackend = Join-Path $portableDir 'FlySwarm/Resources/backend/FlySwarmBackend/FlySwarmBackend.exe'
          $portableData = Join-Path $portableDir 'FlySwarm/Resources/MaleCNS'
          & $portableBackend --check-data --data-dir $portableData
          if ($LASTEXITCODE -ne 0) { throw 'Portable MaleCNS dataset validation failed.' }
          & $portableBackend --marl --output-root (Join-Path $env:RUNNER_TEMP 'portable-smoke') baseline --episodes 1 --max-steps 16
          if ($LASTEXITCODE -ne 0) { throw 'Portable Random baseline smoke failed.' }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlySwarm-Student-Windows-x64-installer
          path: |
            build/windows/FlySwarm-*-windows-x64-setup.exe
            build/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows portable archive
        uses: actions/upload-artifact@v4
        with:
          name: FlySwarm-Student-Windows-x64-portable
          path: |
            build/windows/FlySwarm-*-windows-x64.zip
            build/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30
